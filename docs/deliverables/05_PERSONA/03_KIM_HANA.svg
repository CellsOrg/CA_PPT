<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16294F"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EC6A22"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#939BA8"/></marker></defs><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="56.0" y="46.0" font-size="14" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="2" opacity="1">☁  CLOUD ALPACAS</text><text x="56.0" y="78.0" font-size="14.5" fill="#0A5C62" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">PERSONA PROFILE · 03 / 04</text><rect x="1690.1" y="34.0" width="173.9" height="40.0" rx="20" fill="#e2eff0" stroke="#0E7A82" stroke-width="1.6" opacity="1"/><text x="1777.0" y="60.0" font-size="15" fill="#0A5C62" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">Sponsor · Brand</text><rect x="56.0" y="104.0" width="592.0" height="360.0" rx="22" fill="#e9f3f3" stroke="#0E7A82" stroke-width="1.6" opacity="1"/><circle cx="352.0" cy="244" r="92" fill="#FFFFFF" stroke="#0E7A82" stroke-width="2.6"/><text x="352.0" y="280.0" font-size="100" fill="#0E7A82" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">하</text><path d="M 326.0 370 l 6 -18 h 40 l 6 18 z" fill="none" stroke="#0A5C62" stroke-width="5" stroke-linejoin="round"/><rect x="330.0" y="370" width="44" height="30" rx="3" fill="none" stroke="#0A5C62" stroke-width="5"/><line x1="352.0" y1="370" x2="352.0" y2="400" stroke="#0A5C62" stroke-width="5"/><text x="352.0" y="434.0" font-size="14.5" fill="#0A5C62" font-weight="700" text-anchor="middle" letter-spacing="1.6" opacity="1">SPONSOR — d&#x27;ALBA (예시 시나리오)</text><text x="56.0" y="526.0" font-size="44" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">김하나</text><text x="56.0" y="560.0" font-size="16.5" fill="#5A6472" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">d&#x27;Alba(달바) · 뷰티/스킨케어 브랜드 — 스폰서십 검토 담당 </text><text x="56.0" y="583.0" font-size="16.5" fill="#5A6472" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">(이름·직책은 예시)</text><rect x="56" y="620" width="5" height="70" rx="2.5" fill="#0E7A82"/><text x="78.0" y="646.0" font-size="19" fill="#0A5C62" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">“Cloud Alpacas 팬덤이 우리 브랜드에 만드는 사업적</text><text x="78.0" y="673.0" font-size="19" fill="#0A5C62" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">가치를 판단한다.”</text><text x="56.0" y="746.0" font-size="13.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="1.3" opacity="1">브랜드 상황 · CONTEXT</text><circle cx="59" cy="773" r="3" fill="#0E7A82"/><text x="72.0" y="778.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">d&#x27;Alba는 뷰티/스킨케어 브랜드 — Cloud Alpacas Top 10 추천 중 Fan Fit이</text><text x="72.0" y="798.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">높은 대표 사례</text><circle cx="59" cy="824" r="3" fill="#0E7A82"/><text x="72.0" y="829.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Cloud Alpacas 팬덤은 최근 여성 팬 유입이 크게 늘고, 뷰티·라이프스타일·F&amp;B</text><text x="72.0" y="849.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">관심이 높다</text><circle cx="59" cy="875" r="3" fill="#0E7A82"/><text x="72.0" y="880.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">구단이 제안하는 것: 구장·전광판·펜스 광고, 공식 SNS 노출, Brand Day,</text><text x="72.0" y="900.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">프로모션, Collaboration Goods</text><circle cx="59" cy="926" r="3" fill="#0E7A82"/><text x="72.0" y="931.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">일방적으로 “판매되는 광고주”가 아니라, 팬덤 가치를 스스로 판단하려는 입장</text><path d="M 682.0 104.0 L 682.0 1016.0" stroke="#D9DFE8" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="720.0" y="203.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="203.0" width="6" height="162" rx="3" fill="#0E7A82"/><text x="746.0" y="239.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">핵심 이슈 · KEY ISSUES</text><circle cx="747" cy="268.0" r="3" fill="#0E7A82"/><text x="760.0" y="273.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">이 브랜드의 타겟 고객층이 Cloud Alpacas 팬덤과 정말 겹치는가?</text><circle cx="747" cy="300.0" r="3" fill="#0E7A82"/><text x="760.0" y="305.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">계약이 성사돼도 실제 광고 효과가 기대에 못 미칠 위험은 없는가?</text><circle cx="747" cy="332.0" r="3" fill="#0E7A82"/><text x="760.0" y="337.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">구단이 감이 아니라 팬 데이터(Recommendation Reason)를 근거로 제안하는가?</text><rect x="720.0" y="389.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="389.0" width="6" height="162" rx="3" fill="#0E7A82"/><text x="746.0" y="425.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">우려 · 현재 상태</text><circle cx="747" cy="454.0" r="3" fill="#0E7A82"/><text x="760.0" y="459.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">팬 Audience와 브랜드 타겟의 적합도(Brand Fit)를 확인할 근거가 필요하다</text><circle cx="747" cy="486.0" r="3" fill="#0E7A82"/><text x="760.0" y="491.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">어떤 Sponsorship Package가 우리 브랜드 노출 목표에 맞는지 판단해야 한다</text><circle cx="747" cy="518.0" r="3" fill="#0E7A82"/><text x="760.0" y="523.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">과거 잘못된 타깃 가정으로 성과를 못 낸 스폰서 사례를 경계한다</text><rect x="720.0" y="575.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="575.0" width="6" height="162" rx="3" fill="#0E7A82"/><text x="746.0" y="611.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">목표 · Business Outcome</text><circle cx="747" cy="640.0" r="3" fill="#0E7A82"/><text x="760.0" y="645.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">팬 Audience와 브랜드 타겟의 적합도(Brand Fit)를 데이터로 확인한다</text><circle cx="747" cy="672.0" r="3" fill="#0E7A82"/><text x="760.0" y="677.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">스폰서십 투자 대비 브랜드 가치와 사업 성과(Business Outcome)를 확보한다</text><circle cx="747" cy="704.0" r="3" fill="#0E7A82"/><text x="760.0" y="709.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">구단과 장기적으로 유효한 파트너 관계로 발전할 수 있는지 가늠한다</text><rect x="720.0" y="864.0" width="1144.0" height="150.0" rx="16" fill="#0E7A82" stroke="none" stroke-width="1" opacity="1"/><text x="748.0" y="900.0" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.5" opacity="0.8">핵심 질문  ·  KEY QUESTION</text><text x="748.0" y="938.0" font-size="26" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">Cloud Alpacas의 팬덤이 우리 브랜드에 어떤 가치를 주는가?</text><text x="748.0" y="986.0" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" opacity="0.92">Fan Audience → Brand Fit → Sponsorship Value → Business Outcome</text><text x="56.0" y="1058.0" font-size="12" fill="#939BA8" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">근거: 00_STORY.md §8.2·§8.3 (d&#x27;Alba·팬덤 관심사·Sponsorship Package) · §2[P2] Pain Point 4·7   |   이름 “김하나”와 직책은 문서에 없는 예시</text></svg>