="14.5" fill="#2E4E93" font-weight="700" text-anchor="middle" letter-spacing="1.6" opacity="1">B2C FRM MANAGER</text><text x="56.0" y="526.0" font-size="44" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">김매니저</text><text x="56.0" y="560.0" font-size="16.5" fill="#5A6472" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Cloud Alpacas FRM Manager · Salesforce Customer 360 사용자(User)</text><rect x="56" y="597" width="5" height="70" rx="2.5" fill="#16294F"/><text x="78.0" y="623.0" font-size="19" fill="#2E4E93" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">“팬 데이터를 근거로, 지금 이 팬에게 가장 적절한 다음</text><text x="78.0" y="650.0" font-size="19" fill="#2E4E93" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">행동을 실행한다.”</text><text x="56.0" y="723.0" font-size="13.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="1.3" opacity="1">업무 방식 · WORK STYLE</text><circle cx="59" cy="750" r="3" fill="#16294F"/><text x="72.0" y="755.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Customer 360으로 팬이 여정(SNS→가입→첫직관→굿즈→재방문→멤버십)의 어디쯤</text><text x="72.0" y="775.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">있는지 확인</text><circle cx="59" cy="801" r="3" fill="#16294F"/><text x="72.0" y="806.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Current Segment · Engagement Level · Fan Value 3개 축으로 팬을 이해</text><circle cx="59" cy="832" r="3" fill="#16294F"/><text x="72.0" y="837.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">상태에 맞는 Next Best Action 실행 — Welcome / First Ticket / First Visit</text><text x="72.0" y="857.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">/ Membership Campaign</text><circle cx="59" cy="883" r="3" fill="#16294F"/><text x="72.0" y="888.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">KPI로 성과 관리 — 활성화율 · 첫 관람 전환율 · 재방문율 · 멤버십 가입률 ·</text><text x="72.0" y="908.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Fan LTV</text><path d="M 682.0 104.0 L 682.0 1016.0" stroke="#D9DFE8" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="720.0" y="203.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="203.0" width="6" height="162" rx="3" fill="#16294F"/><text x="746.0" y="239.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">핵심 이슈 · KEY ISSUES</text><circle cx="747" cy="268.0" r="3" fill="#16294F"/><text x="760.0" y="273.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">팬 정보가 티켓·굿즈·멤버십·앱·문의로 흩어져 “팬은 안 보이고 데이터만 보인다”</text><circle cx="747" cy="300.0" r="3" fill="#16294F"/><text x="760.0" y="305.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">이루키가 무엇을 좋아하는지 연결해서 볼 수 없다 — 360° Fan View 부재</text><circle cx="747" cy="332.0" r="3" fill="#16294F"/><text x="760.0" y="337.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">누가 Ticket Only Fan · Membership Candidate · VIP 후보인지 자동으로 알 수 없다</text><rect x="720.0" y="389.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="389.0" width="6" height="162" rx="3" fill="#16294F"/><text x="746.0" y="425.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">Pain Point · 현재 상태</text><circle cx="747" cy="454.0" r="3" fill="#16294F"/><text x="760.0" y="459.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">모든 팬에게 같은 이벤트 · 같은 쿠폰 · 같은 메시지를 보낸다</text><circle cx="747" cy="486.0" r="3" fill="#16294F"/><text x="760.0" y="491.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">VIP 가능성이 높은 팬도 엑셀을 정리한 후에야 발견한다 — 타이밍을 놓친다</text><circle cx="747" cy="518.0" r="3" fill="#16294F"/><text x="760.0" y="523.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">신규 팬이 1,000명 생겨도 누구에게 무엇을 제안할지 우선순위를 알 수 없다</text><rect x="720.0" y="575.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="575.0" width="6" height="162" rx="3" fill="#16294F"/><text x="746.0" y="611.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">목표 · 우선순위 · GOALS</text><circle cx="747" cy="640.0" r="3" fill="#16294F"/><text x="760.0" y="645.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">신규 팬을 이해하고 개인화된 액션으로 충성 팬으로 성장시킨다</text><circle cx="747" cy="672.0" r="3" fill="#16294F"/><text x="760.0" y="677.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">첫 관람 · 재방문 · 첫 굿즈 · 멤버십 · 시즌권 전환율을 높인다</text><circle cx="747" cy="704.0" r="3" fill="#16294F"/><text x="760.0" y="709.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">장기적으로 Fan Lifetime Value를 극대화한다 (구단 Phase 1 Business Goal)</text><rect x="720.0" y="864.0" width="1144.0" height="150.0" rx="16" fill="#16294F" stroke="none" stroke-width="1" opacity="1"/><text x="748.0" y="900.0" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.5" opacity="0.8">핵심 질문  ·  KEY QUESTION</text><text x="748.0" y="938.0" font-size="26" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">어떤 팬에게 지금 무엇을 제안해야 하는가?</text><text x="748.0" y="986.0" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" opacity="0.92">Fan Insight → Fan 이해 → Recommendation → 개인화 → Action</text><text x="56.0" y="1058.0" font-size="12" fill="#939BA8" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">근거: 00_STORY.md §1 Business Goal · §2 Pain Point 1–5 · §3 FRM Team/KPI · §4·§5 Persona/Journey · §6 Segment · §7 Next Best Action</text></svg>