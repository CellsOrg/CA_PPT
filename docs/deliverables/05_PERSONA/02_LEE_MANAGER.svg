<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16294F"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EC6A22"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#939BA8"/></marker></defs><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="56.0" y="46.0" font-size="14" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="2" opacity="1">☁  CLOUD ALPACAS</text><text x="56.0" y="78.0" font-size="14.5" fill="#B24B12" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">PERSONA PROFILE · 02 / 04</text><rect x="1620.8" y="34.0" width="243.2" height="40.0" rx="20" fill="#fcede4" stroke="#EC6A22" stroke-width="1.6" opacity="1"/><text x="1742.4" y="60.0" font-size="15" fill="#B24B12" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">B2B · Sponsorship Sales</text><rect x="56.0" y="104.0" width="592.0" height="360.0" rx="22" fill="#fdf1eb" stroke="#EC6A22" stroke-width="1.6" opacity="1"/><circle cx="352.0" cy="244" r="92" fill="#FFFFFF" stroke="#EC6A22" stroke-width="2.6"/><text x="352.0" y="280.0" font-size="100" fill="#EC6A22" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">이</text><rect x="326.0" y="362" width="52" height="34" rx="5" fill="none" stroke="#B24B12" stroke-width="5"/><path d="M 340.0 362 v-8 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 v8" fill="none" stroke="#B24B12" stroke-width="5"/><line x1="326.0" y1="379" x2="378.0" y2="379" stroke="#B24B12" stroke-width="5"/><text x="352.0" y="434.0" font-size="14.5" fill="#B24B12" font-weight="700" text-anchor="middle" letter-spacing="1.6" opacity="1">B2B SPONSORSHIP SALES MANAGER</text><text x="56.0" y="526.0" font-size="44" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">이매니저</text><text x="56.0" y="560.0" font-size="16.5" fill="#5A6472" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Cloud Alpacas Sponsorship Sales Manager  ·  이름 가칭(TBD)</text><rect x="56" y="597" width="5" height="43" rx="2.5" fill="#EC6A22"/><text x="78.0" y="623.0" font-size="19" fill="#B24B12" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">“팬을 이해하고, 기업을 찾아, 계약으로 연결한다.”</text><text x="56.0" y="696.0" font-size="13.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="1.3" opacity="1">업무 방식 · WORK STYLE</text><circle cx="59" cy="723" r="3" fill="#EC6A22"/><text x="72.0" y="728.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Fan 360 데이터에서 팬덤의 광고 가치 가설을 세운다 (예: 여성 팬 유입↑ ·</text><text x="72.0" y="748.0" font-size="14.5" fill="#5A6472" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">뷰티/라이프스타일/F&amp;B 관심↑)</text><circle cx="59" cy="774" r="3" fill="#EC6A22"/><text x="72.0" y="779.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">기업 DB(약 100개) + Agentforce Top 10 추천 + Recommendation Reason 검토</text><circle cx="59" cy="805" r="3" fill="#EC6A22"/><text x="72.0" y="810.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">실제 Outbound 대상만 Lead 등록 → Lead Qualification · Lead Score 평가</text><circle cx="59" cy="836" r="3" fill="#EC6A22"/><text x="72.0" y="841.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Opportunity → Sponsorship Package/Quote → Negotiation → Closed Won</text><circle cx="59" cy="867" r="3" fill="#EC6A22"/><text x="72.0" y="872.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Pipeline / Revenue Dashboard로 목표 매출 대비 부족분 관리</text><path d="M 682.0 104.0 L 682.0 1016.0" stroke="#D9DFE8" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="720.0" y="187.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="187.0" width="6" height="162" rx="3" fill="#EC6A22"/><text x="746.0" y="223.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">핵심 이슈 · KEY ISSUES</text><circle cx="747" cy="252.0" r="3" fill="#EC6A22"/><text x="760.0" y="257.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">“유명한 회사”가 아니라 우리 팬덤에 실제 광고 가치가 높은 기업을 찾아야 한다</text><circle cx="747" cy="284.0" r="3" fill="#EC6A22"/><text x="760.0" y="289.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Agentforce Fan Fit Score ≠ Lead Score — Fit이 높다고 계약 가능성이 높은 건 아니다</text><circle cx="747" cy="316.0" r="3" fill="#EC6A22"/><text x="760.0" y="321.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Pipeline이 목표 매출 대비 얼마나 부족한지, 스폰서가 몇 개 더 필요한지 알아야 한다</text><rect x="720.0" y="373.0" width="1144.0" height="194.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="373.0" width="6" height="194" rx="3" fill="#EC6A22"/><text x="746.0" y="409.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">Pain Point · 현재 상태</text><circle cx="747" cy="438.0" r="3" fill="#EC6A22"/><text x="760.0" y="443.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">팬은 늘고 있는데 구단은 여전히 적자 — 티켓·멤버십·굿즈 매출만으로는 부족하다</text><circle cx="747" cy="470.0" r="3" fill="#EC6A22"/><text x="760.0" y="475.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">팬이 어떤 브랜드·콘텐츠에 반응하는지 데이터 없이 감·인맥에 의존해 영업한다</text><circle cx="747" cy="502.0" r="3" fill="#EC6A22"/><text x="760.0" y="507.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">후보 기업과 팬층의 광고 Fit을 검증할 근거가 없다</text><circle cx="747" cy="534.0" r="3" fill="#EC6A22"/><text x="760.0" y="539.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">과거 “야구 팬 = 40~50대 남성” 가정으로 진행한 장기 캠페인이 성과를 내지 못했다</text><rect x="720.0" y="591.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="591.0" width="6" height="162" rx="3" fill="#EC6A22"/><text x="746.0" y="627.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">목표 · 우선순위 · GOALS</text><circle cx="747" cy="656.0" r="3" fill="#EC6A22"/><text x="760.0" y="661.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Fan 360 데이터를 근거로 팬덤에 광고 가치가 높은 기업을 발굴한다</text><circle cx="747" cy="688.0" r="3" fill="#EC6A22"/><text x="760.0" y="693.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Lead → Opportunity → Contract Pipeline으로 연결해 Sponsorship Revenue를 만든다</text><circle cx="747" cy="720.0" r="3" fill="#EC6A22"/><text x="760.0" y="725.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">목표 매출 대비 Pipeline 부족분을 추가 Outbound Lead 발굴로 메운다</text><rect x="720.0" y="864.0" width="1144.0" height="150.0" rx="16" fill="#EC6A22" stroke="none" stroke-width="1" opacity="1"/><text x="748.0" y="900.0" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.5" opacity="0.8">핵심 질문  ·  KEY QUESTION</text><text x="748.0" y="938.0" font-size="26" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">어떤 기업을 먼저 접촉하고, 어떻게 계약으로 이끌 것인가?</text><text x="748.0" y="986.0" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" opacity="0.92">기업 발굴 → Fit 분석 → 영업 → 제안 → 계약 → 관계 확대</text><text x="56.0" y="1058.0" font-size="12" fill="#939BA8" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">근거: 00_STORY.md §1[P2] · §2[P2] Pain Point 1–7 · §4[P2] 이 매니저 · §8 Phase 2 Story · §9 B2B Next Best Action</text></svg>