<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16294F"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EC6A22"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#939BA8"/></marker></defs><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="56.0" y="46.0" font-size="14" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="2" opacity="1">☁  CLOUD ALPACAS</text><text x="56.0" y="78.0" font-size="14.5" fill="#98305F" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">PERSONA PROFILE · 04 / 04</text><rect x="1664.1" y="34.0" width="199.9" height="40.0" rx="20" fill="#f7e8ef" stroke="#C0477F" stroke-width="1.6" opacity="1"/><text x="1764.0" y="60.0" font-size="15" fill="#98305F" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">Fan · B2C Customer</text><rect x="56.0" y="104.0" width="592.0" height="360.0" rx="22" fill="#f9eef3" stroke="#C0477F" stroke-width="1.6" opacity="1"/><circle cx="352.0" cy="244" r="92" fill="#FFFFFF" stroke="#C0477F" stroke-width="2.6"/><text x="352.0" y="280.0" font-size="100" fill="#C0477F" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">루</text><circle cx="352.0" cy="362" r="11" fill="none" stroke="#98305F" stroke-width="5"/><path d="M 332.0 398 a20 20 0 0 1 40 0" fill="none" stroke="#98305F" stroke-width="5"/><text x="352.0" y="434.0" font-size="14.5" fill="#98305F" font-weight="700" text-anchor="middle" letter-spacing="1.6" opacity="1">FAN — B2C CUSTOMER</text><text x="56.0" y="526.0" font-size="44" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">이루키</text><text x="56.0" y="560.0" font-size="16.5" fill="#5A6472" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">27세 · 직장인 · Cloud Alpacas 신규 팬  (20대 여성 대표 팬)</text><rect x="56" y="597" width="5" height="43" rx="2.5" fill="#C0477F"/><text x="78.0" y="623.0" font-size="19" fill="#98305F" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">“내 활동과 취향에 맞는 경험과 제안을 받고 싶다.”</text><text x="56.0" y="696.0" font-size="13.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="1.3" opacity="1">팬 특성 · FAN CHARACTERISTICS</text><circle cx="59" cy="723" r="3" fill="#C0477F"/><text x="72.0" y="728.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">야구를 거의 본 적이 없다</text><circle cx="59" cy="754" r="3" fill="#C0477F"/><text x="72.0" y="759.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SNS에서 우연히 문선수의 영상을 보고 Cloud Alpacas에 관심을 갖게 됐다</text><circle cx="59" cy="785" r="3" fill="#C0477F"/><text x="72.0" y="790.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">친구와 함께 첫 직관을 경험했다</text><circle cx="59" cy="816" r="3" fill="#C0477F"/><text x="72.0" y="821.0" font-size="14.5" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">응원 문화와 경기장 분위기에 빠져 점점 클라우드 팬이 되어간다</text><path d="M 682.0 104.0 L 682.0 1016.0" stroke="#D9DFE8" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="720.0" y="203.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="203.0" width="6" height="162" rx="3" fill="#C0477F"/><text x="746.0" y="239.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">Fan Journey · 기대</text><circle cx="747" cy="268.0" r="3" fill="#C0477F"/><text x="760.0" y="273.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">여정: SNS → 회원가입 → 첫 티켓 → 첫 직관 → 첫 굿즈 → 재방문 → 멤버십 → 충성팬</text><circle cx="747" cy="300.0" r="3" fill="#C0477F"/><text x="760.0" y="305.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">구단이 나를 팬으로 이해하는가 — 문선수를 좋아하고 직관을 다녀온 걸 아는가?</text><circle cx="747" cy="332.0" r="3" fill="#C0477F"/><text x="760.0" y="337.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">내 상태(New Fan / Active Fan)에 맞는 다음 경험을 안내받고 있는가?</text><rect x="720.0" y="389.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="389.0" width="6" height="162" rx="3" fill="#C0477F"/><text x="746.0" y="425.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">Pain Point · 현재 상태</text><circle cx="747" cy="454.0" r="3" fill="#C0477F"/><text x="760.0" y="459.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">모든 팬에게 똑같은 이벤트·쿠폰·메시지가 온다 — 내게 맞는 제안이 아니다</text><circle cx="747" cy="486.0" r="3" fill="#C0477F"/><text x="760.0" y="491.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">첫 직관 후 무엇을 하면 좋을지(굿즈·재방문·멤버십) 안내가 없다</text><circle cx="747" cy="518.0" r="3" fill="#C0477F"/><text x="760.0" y="523.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">관심이 식기 쉬운 시점에 적절한 계기를 받지 못하면 그냥 멀어진다</text><rect x="720.0" y="575.0" width="1144.0" height="162.0" rx="16" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" opacity="1"/><rect x="720" y="575.0" width="6" height="162" rx="3" fill="#C0477F"/><text x="746.0" y="611.0" font-size="16.5" fill="#16294F" font-weight="800" text-anchor="start" letter-spacing="0.5" opacity="1">이루키가 원하는 것 · GOALS</text><circle cx="747" cy="640.0" r="3" fill="#C0477F"/><text x="760.0" y="645.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">내 취향(문선수·응원문화)에 맞는 개인화된 경험</text><circle cx="747" cy="672.0" r="3" fill="#C0477F"/><text x="760.0" y="677.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">적절한 시점의 다음 단계 제안 — 첫 굿즈, 재방문, 멤버십</text><circle cx="747" cy="704.0" r="3" fill="#C0477F"/><text x="760.0" y="709.0" font-size="15" fill="#1E2532" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Cloud Alpacas와 오래 함께하는 충성 팬으로 성장</text><rect x="720.0" y="864.0" width="1144.0" height="150.0" rx="16" fill="#C0477F" stroke="none" stroke-width="1" opacity="1"/><text x="748.0" y="900.0" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.5" opacity="0.8">핵심 질문  ·  KEY QUESTION</text><text x="748.0" y="938.0" font-size="26" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">나에게 적합한 경험과 제안을 받고 있는가?</text><text x="748.0" y="986.0" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0" opacity="0.92">Fan Activity → Fan Profile → Personalized Experience → Loyalty</text><text x="56.0" y="1058.0" font-size="12" fill="#939BA8" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">근거: 00_STORY.md §4 이루키 · §5 Customer Journey · §6 Current Segment · §7 Next Best Action · §2 Pain Point 2·3   |   이루키의 데이터가 쌓일수록 이매니저의 근거도 쌓인다(§4·§8.3)</text></svg>