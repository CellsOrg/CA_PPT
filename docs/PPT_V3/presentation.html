<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Alpacas · Final Presentation</title>
<style>
  :root{
    --navy:#061b40; --orange:#ff6b00; --paper:#F4F6F8;
    --ink:#eaf1fb; --muted:#9fb3d4; --dur:640ms; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#02102a;overflow:hidden;
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;background:
    radial-gradient(1200px 700px at 50% -10%,#0c2a5c 0%,var(--navy) 55%,#02102a 100%);}

  .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transform:scale(.985);
    transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),visibility 0s linear var(--dur);}
  .slide.active{opacity:1;visibility:visible;transform:none;z-index:2;
    transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease),visibility 0s;}
  .slide.prev{opacity:0;transform:translateX(-4%) scale(.985)}
  .slide.next{opacity:0;transform:translateX(4%) scale(.985)}

  /* 16:9 slide box that maps to the 1920x1080 PNG grid */
  .box{position:relative;width:100%;height:100%;max-width:calc(100vh * 16/9);max-height:calc(100vw * 9/16);
    aspect-ratio:16/9;margin:auto}
  .box>img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .ov{position:absolute;inset:0;pointer-events:none}
  .ov>*{position:absolute}
  .mask{background:var(--paper)}
  .oimg{object-fit:contain}
  .oimg.cover{object-fit:cover}
  .card-shot{border-radius:14px;box-shadow:0 10px 30px rgba(10,25,60,.16);object-fit:cover;
    border:1px solid rgba(20,40,80,.08)}
  .otext{color:#586374;font-weight:600;line-height:1.4}

  /* framed capture inside a demo placeholder */
  .shot{object-fit:contain;border-radius:10px;background:#fff;
    box-shadow:0 14px 40px rgba(5,20,50,.28),0 0 0 1px rgba(20,40,80,.10)}

  /* ---- article slam (slide 01) ---- */
  .slam{position:absolute;inset:0;background:rgba(4,14,34,.0);pointer-events:none;z-index:5;
    transition:background .4s ease}
  .slam.on{background:rgba(4,14,34,.78)}
  .slam .art{position:absolute;border-radius:8px;opacity:0;background:#fff;
    box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 4px #fff;transform:scale(1.5) rotate(var(--rot));
    border:1px solid rgba(0,0,0,.2)}
  .slam .art img{display:block;width:100%;height:auto;border-radius:7px}
  .slam .art.cover4{z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 0 5px #fff}
  .slam .art.hit{animation:slam .42s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes slam{0%{opacity:0;transform:scale(1.6) rotate(var(--rot))}
    60%{opacity:1;transform:scale(.94) rotate(var(--rot))}
    100%{opacity:1;transform:scale(1) rotate(var(--rot))}}
  .slam.clear{background:transparent!important}
  .slam.clear .art{opacity:0;transform:scale(1.04);transition:opacity .5s ease,transform .5s ease}
  /* highlight-emphasis + slide-up (slides 14/15) */
  .seq .hl{position:absolute;object-fit:contain;background:#fff;border-radius:10px;padding:5px;
    box-shadow:0 16px 42px rgba(5,20,50,.30),0 0 0 1px rgba(20,40,80,.10);
    opacity:0;transition:opacity .7s ease}
  .seq .hl.show{opacity:1}
  .seq .up{position:absolute;object-fit:contain;background:#fff;border-radius:10px;padding:5px;
    box-shadow:0 -10px 44px rgba(5,20,50,.4),0 0 0 1px rgba(20,40,80,.10);
    transform:translateY(115%);transition:transform .7s cubic-bezier(.22,.61,.36,1)}
  .seq .up.show{transform:translateY(0)}

  /* ---- chrome ---- */
  #bar{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:40}
  #barfill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffb066);transition:width var(--dur) var(--ease)}
  #hud{position:fixed;bottom:16px;right:22px;z-index:41;display:flex;align-items:center;gap:14px;
    font-size:13px;color:var(--muted);opacity:0;transition:opacity .3s;user-select:none}
  #stage:hover #hud{opacity:.9}
  #counter{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
  .navbtn{cursor:pointer;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:var(--ink);font-size:16px;display:grid;place-items:center;pointer-events:auto}
  .navbtn:hover{background:rgba(255,255,255,.16)}
  #title{position:fixed;bottom:16px;left:22px;z-index:41;font-size:13px;color:var(--muted);opacity:0;transition:opacity .3s}
  #stage:hover #title{opacity:.75}
  #grid{position:fixed;inset:0;z-index:60;background:#02102a;overflow:auto;padding:34px;display:none;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-content:start}
  #grid.show{display:grid}
  .thumb{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#0a2350;
    border:2px solid transparent;aspect-ratio:16/9}
  .thumb.cur{border-color:var(--orange)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
  .thumb .n{position:absolute;top:5px;left:7px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000}
  .thumb .k{position:absolute;bottom:5px;right:7px;font-size:10px;font-weight:800;letter-spacing:.06em;
    padding:2px 6px;border-radius:4px;background:var(--orange);color:#fff}
  #hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:41;font-size:13px;color:var(--muted);
    background:rgba(3,20,45,.7);border:1px solid rgba(255,255,255,.14);padding:7px 15px;border-radius:20px;transition:opacity .6s}
  #hint.hide{opacity:0}
  kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;color:var(--ink)}
  /* export mode: hide chrome, freeze transitions (for PPTX PNG capture) */
  body.export #hint,body.export #bar,body.export #hud,body.export #title{display:none!important}
  body.export .slide{transition:none!important}
  body.export #stage{background:#F4F6F8}
</style>
</head>
<body>
<div id="stage">
  <div id="hint"><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>F</kbd> 전체화면 · <kbd>O</kbd> 개요 · <kbd>R</kbd> 애니메이션 다시</div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="title">Cloud Alpacas · Final Presentation</div>
  <div id="hud">
    <div class="navbtn" data-act="prev">‹</div><span id="counter">1 / 1</span>
    <div class="navbtn" data-act="next">›</div>
    <div class="navbtn" data-act="grid">▦</div><div class="navbtn" data-act="full">⛶</div>
  </div>
</div>
<div id="grid"></div>

<script>
(function(){
  const P='slides/', O='overlays/', C='captures/';
  const OVW={x:56,y:222,w:1812,h:800}, DEMO={x:56,y:338,w:1812,h:686};
  const NOSHOT=/[?&]noshot/.test(location.search);  // background-only render (photos placed as PPTX objects instead)
  // 29 wireframe slides in deck order. ovl = overlay HTML (positioned in % of the 1920x1080 grid). anim = enter hook key.
  const S = [
    {src:P+'slide-00.png',  name:'00 · Cover', ovl:coverOv()},
    {src:P+'slide-01.png',  name:'01 · 프로젝트 선정 배경', ovl:slide01Ov(), anim:'articles'},
    {src:P+'slide-02.png',  name:'02 · Cloud Alpacas 소개', ovl:slide02Ov()},
    {src:P+'slide-03.png',  name:'03 · 팀 구성과 역할'},
    {src:P+'slide-04.png',  name:'04 · 수행 절차 및 방법'},
    {src:P+'slide-05.png',  name:'05 · AS-IS → TO-BE'},
    {src:P+'slide-06.png',  name:'06 · Scene S1 — Fan 360', ovl:slide06Ov()},
    {src:P+'slide-06A.png', name:'06A · Fan Event (Live)'},
    {src:P+'slide-07.png',  name:'07 · S1 Demo Flow', ovl:demoMasks()},
    {src:P+'slide-08.png',  name:'08 · Scene S2 개요', ovl:slide08Ov()},
    {src:P+'slide-09.png',  name:'09 · S2 Demo Flow', ovl:slide09Ov()},
    {src:P+'slide-10.png',  name:'10 · Scene S3 개요', ovl:demoMasks()},
    {src:P+'slide-11.png',  name:'11 · S3 Demo Flow', ovl:demoMasks()},
    {src:P+'slide-12.png',  name:'14 · B2B Analytics', ovl:slide12Ov(), anim:'highlightSeq',
      seq:{base:'cap_s5_dashboard_full.png',hl:'cap_s5_dashboard_highlight.png',up:'cap_s5_tableau_analytics.png'}},
    {src:P+'slide-13.png',  name:'15 · B2B Lead', ovl:slide13Ov(), anim:'highlightSeq',
      seq:{base:'cap_s5_lead_detail.png',hl:'cap_s5_lead_highlight.png'}},
    {src:P+'slide-14.png',  name:'14 · Scene S5 개요', ovl:demoMasks()},
    {src:P+'slide-15.png',  name:'15 · S5 Demo Flow', ovl:demoMasks()},
    {src:P+'slide-16.png',  name:'16 · Scene S6 개요', ovl:demoMasks()},
    {src:P+'slide-19.png',  name:'21 · (사진 이동됨)', ovl:slide19Ov()},
    {src:P+'slide-20.png',  name:'22 · Opportunity·Negotiation', ovl:slide20Ov(), anim:'stack',
      imgs:['opt_nego_1.png','opt_nego_2.png','opt_nego_3.png']},
    {src:P+'slide-21.png',  name:'23 · Opp Agent Demo', ovl:slide21Ov()},
    {src:P+'slide-22.png',  name:'22 · Scene S9 개요', ovl:demoMasks()},
    {src:P+'slide-23.png',  name:'23 · S9 Demo Flow', ovl:demoMasks()},
    {src:P+'slide-24.png',  name:'24 · 성과 및 마무리', ovl:demoMasks()},
    {src:P+'slide-25.png',  name:'25 · 자체 평가', ovl:demoMasks()},
    {src:P+'slide-26.png',  name:'26 · Ending', ovl:slide26Ov()},
    {src:P+'slide-27.png',  name:'27 · Gift Notice'},
  ];

  // ---------- overlay builders (coords in %; box maps to 1920x1080) ----------
  function px(x){return (x/19.2)}      // 1920px -> %
  function py(y){return (y/10.8)}      // 1080px -> %
  function st(x,y,w,h){return `left:${px(x)}%;top:${py(y)}%;width:${px(w)}%;height:${py(h)}%;`}

  function coverOv(){
    // full clean cover: cover all wireframe scaffolding with paper, then rebuild typographically
    return `
      <div class="mask" style="left:0;top:0;width:100%;height:100%;"></div>
      <div style="left:0;top:0;width:100%;height:0.9%;background:linear-gradient(90deg,#061b40,#ff6b00,#061b40);"></div>
      <img class="oimg" src="${O}logo5.png" style="${st(795,96,330,330)}">
      <div style="${st(120,556,1680,130)}text-align:center;font-size:3.7vw;font-weight:800;color:#15233c;letter-spacing:-.01em;line-height:1.05;">FROM FAN DATA TO REVENUE.</div>
      <div style="${st(120,712,1680,44)}text-align:center;font-size:1.25vw;font-weight:600;color:#66758d;">Cellsforce · Cloud Alpacas — Fan Relationship Management Team</div>
      <div style="${st(120,760,1680,36)}text-align:center;font-size:1.0vw;font-weight:800;color:#2F6FB0;letter-spacing:.18em;">FINAL PRESENTATION</div>`;
  }

  function slide01Ov(){
    const B2C='#2F6FB0', B2B='#1E9E6A';
    const pts=[[14,86],[120,74],[226,50],[332,38],[452,16]];
    const chart=`<div style="${st(108,446,500,222)}background:#F3F8FF;border:1px solid #DCE7F5;border-radius:12px;
        padding:1.3% 1.5%;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;font-size:.72vw;font-weight:800;color:#2F6FB0;letter-spacing:.02em;">
        <span>KBO 관중 규모 · 만 명</span><span style="color:#98A2B1;">최근 5년</span></div>
      <svg viewBox="0 0 466 122" preserveAspectRatio="none" style="width:100%;flex:1;margin:3% 0 2%;overflow:visible;">
        <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff6b00" stop-opacity=".38"/><stop offset="1" stop-color="#ff6b00" stop-opacity="0"/></linearGradient></defs>
        <polygon points="14,110 14,86 120,74 226,50 332,38 452,16 452,110" fill="url(#ga)"/>
        <polyline points="14,86 120,74 226,50 332,38 452,16" fill="none" stroke="#ff6b00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="#ff6b00" stroke-width="3"/>`).join('')}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:.64vw;color:#98A2B1;font-weight:700;">
        <span>'21</span><span>'22</span><span>'23</span><span>'24</span><span>'25</span></div>
      <div style="font-size:.82vw;font-weight:800;color:#ff6b00;margin-top:3%;">▲ 역대 최다 · 1,300만 관중 돌파</div>
    </div>`;
    const bigQ=`<div class="mask" style="${st(672,350,80,82)}background:#0B2346;"></div>`+
      `<div style="${st(660,256,606,172)}text-align:center;font-size:6.2vw;font-weight:900;color:#ff6b00;line-height:1;">?</div>`;
    const right=
      `<div class="mask" style="${st(1306,300,552,50)}background:#fff;"></div>`+
      `<div style="${st(1308,304,552,44)}font-size:1.25vw;font-weight:800;color:#15233c;">`+
        `<span style="color:${B2C}">B2C</span>와 <span style="color:${B2B}">B2B</span>는 Fan Value로 연결된다</div>`+
      `<div class="mask" style="${st(1306,568,556,56)}background:#fff;"></div>`+
      `<div style="${st(1308,574,556,50)}font-size:1.0vw;font-weight:700;color:#586374;line-height:1.4;">`+
        `문제는 <b style="color:${B2C}">B2C</b>와 <b style="color:${B2B}">B2B</b>의 가치가 하나의 흐름으로 연결되지 않는 데 있다</div>`;
    return chart+bigQ+right;
  }
  function slide02Ov(){
    // (1) remove "KBO TOP 3 인기 구단이라는 설정 아래," from the subtitle
    // (2) make the FAN VALUE connection between B2C and B2B more intuitive
    const sub = 'Fan Business와 Sponsorship Business라는 두 개의 매출 엔진을 운영한다';
    return `
      <div class="mask" style="${st(80,178,1500,52)}"></div>
      <div style="${st(84,182,1400,46)}font-size:1.55vw;color:#586374;font-weight:600;">${sub}</div>
      <!-- FAN VALUE hub: clear directional flow B2C -> FAN VALUE -> B2B -->
      <div class="mask" style="${st(788,346,294,452)}"></div>
      <div style="${st(806,470,60,54)}font-size:2.4vw;font-weight:900;color:#2F6FB0;text-align:center;">›</div>
      <div style="${st(1000,470,60,54)}font-size:2.4vw;font-weight:900;color:#1E9E6A;text-align:center;">›</div>
      <div style="${st(857,449,150,150)}border-radius:50%;background:linear-gradient(135deg,#2F6FB0,#1E9E6A);
        box-shadow:0 12px 34px rgba(31,111,176,.36),0 0 0 8px rgba(47,111,176,.10);
        display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">
        <div style="font-size:1.05vw;font-weight:900;letter-spacing:.04em;line-height:1.15;text-align:center;">FAN<br>VALUE</div></div>
      <div style="${st(792,432,90,28)}font-size:.72vw;font-weight:800;color:#2F6FB0;text-align:center;letter-spacing:.02em;">팬 데이터</div>
      <div style="${st(988,432,90,28)}font-size:.72vw;font-weight:800;color:#1E9E6A;text-align:center;letter-spacing:.02em;">제안 근거</div>
      <div style="${st(772,624,326,58)}font-size:.92vw;font-weight:700;color:#586374;text-align:center;line-height:1.4;">B2C와 B2B를 잇는<br>하나의 연결 축</div>`;
  }

  function slide03Ov(){
    // mask wireframe badges, then place each member's character image in the top of their card
    const cards=[
      ['member_sara.png',     70],
      ['member_hyejune.png',  432],
      ['member_aaron.png',    793],
      ['member_eunyeong.png', 1155],
      ['member_seungwoo.png', 1516],
    ];
    let imgs='';
    cards.forEach(([f,x])=>{ imgs += `<img class="oimg card-shot" src="${O}${f}" style="${st(x+34,262,278,278)}">`; });
    return `
      <div class="mask" style="${st(1596,38,308,48)}"></div>
      <div class="mask" style="${st(1420,1012,484,62)}"></div>
      ${imgs}`;
  }

  // common wireframe-annotation masks for demo slides
  function demoMasks(){
    return `<div class="mask" style="${st(1596,38,308,48)}"></div>`+   // WIREFRAME · CONTENT & LAYOUT badge
           `<div class="mask" style="${st(1430,1010,474,64)}"></div>`;   // orange design-note (bottom-right)
  }
  function shotIn(x,y,w,h,src){   // real screenshot filling a placeholder
    return `<img class="oimg shot" src="${src}" style="${st(x,y,w,h)}padding:6px;">`;
  }

  function slide04Ov(){
    // remove wireframe labels only (emojis removed per feedback; 7-step ↔ PRINCIPLE swap pending HTML rebuild)
    return demoMasks();
  }
  // full-bleed content areas (right column removed): OVW = overview slides, DEMO = demo-flow slides (below the step bar)
  function fillMask(a){ return demoMasks()+`<div class="mask" style="${st(a.x,a.y,a.w,a.h)}"></div>`; }
  function fillPhoto(a,src){ if(NOSHOT) return fillMask(a); return fillMask(a)+`<img class="oimg shot" src="${C}${src}" style="${st(a.x+8,a.y+8,a.w-16,a.h-16)}padding:6px;">`; }
  function fillVideo(a,src){ if(NOSHOT) return fillMask(a); return fillMask(a)+`<video class="shot" src="${C}${src}" controls playsinline preload="metadata" style="${st(a.x+8,a.y+8,a.w-16,a.h-16)}background:#0d0d0d;"></video>`; }
  function fillSeq(a){ if(NOSHOT) return fillMask(a); return fillMask(a)+`<div class="seq" style="${st(a.x+8,a.y+8,a.w-16,a.h-16)}"></div>`; }

  function slide06Ov(){ return fillPhoto(OVW,'cap_s1_fan360.png'); }             // 7  · Fan 360 full
  function slide08Ov(){ return fillPhoto(OVW,'cap_s2_recommendation_hub.png'); } // 10 · Recommendation Hub full
  function slide09Ov(){ return fillVideo(DEMO,'demo_s2.mp4'); }                  // 11 · personalization video full
  function slide12Ov(){ return fillSeq(OVW); }                                   // 14 · B2B analytics (highlight + slide-up)
  function slide13Ov(){ return fillSeq(DEMO); }                                  // 15 · B2B lead (highlight)
  function slide19Ov(){ return demoMasks(); }                                    // 21 · photos moved to 14 -> plain
  function slide20Ov(){ return fillSeq(OVW); }                                   // 22 · opt-nego captures (stack)
  function slide21Ov(){ return fillPhoto(DEMO,'opt_nego_agent.gif'); }           // 23 · opt agent-nego video (gif) full
  function slide26Ov(){ // Ending: remove WIREFRAME badge + the full-width design note
    return `<div class="mask" style="${st(1548,26,340,56)}"></div>`+
           `<div class="mask" style="${st(40,872,1840,150)}"></div>`;
  }

  // ---------- enter animations ----------
  // ---- step-based sequences: one photo per click (identical model used for PPTX export) ----
  // Each builder returns {max, initial, show(k)}. runSeq wires interactive clicks OR an export step.
  function bArticles(el){
    const old=el.querySelector('.slam'); if(old) old.remove();
    const slam=document.createElement('div'); slam.className='slam';
    el.querySelector('.box').appendChild(slam);
    const pos=[[4,17,29,-4],[35.5,9,29,3],[67,17,29,-2.5]];
    const arts=[];
    pos.forEach((p,i)=>{ const a=document.createElement('div'); a.className='art';
      a.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;--rot:${p[3]}deg;`;
      a.innerHTML=`<img src="${O}article_0${i+1}.png">`; slam.appendChild(a); arts.push(a); });
    const a4=document.createElement('div'); a4.className='art cover4';
    a4.style.cssText='left:19.5%;top:6%;width:42%;--rot:1.5deg;';
    a4.innerHTML=`<img src="${O}article_04.png">`; slam.appendChild(a4); arts.push(a4);
    return { max:5, initial:1, show(k){
      if(k>=5){ slam.classList.remove('on'); slam.classList.add('clear'); return; }
      slam.classList.remove('clear'); slam.classList.add('on');
      arts.forEach((a,i)=>{ if(i<k) a.classList.add('hit'); else { a.classList.remove('hit'); a.style.opacity='0'; } });
    }};
  }
  function bHighlight(el){
    const s=el.querySelector('.seq'); s.innerHTML='';
    const d=JSON.parse(el.dataset.seq||'{}');
    const mk=(src,cls)=>{ const im=document.createElement('img'); im.src=C+src; im.className=cls;
      im.style.cssText='left:0;top:0;width:100%;height:100%;'; return im; };
    const base=mk(d.base,'hl'); base.style.zIndex=1; base.classList.add('show'); s.appendChild(base);
    const hl=mk(d.hl,'hl'); hl.style.zIndex=2; s.appendChild(hl);
    let up=null; if(d.up){ up=mk(d.up,'up'); up.style.zIndex=3; s.appendChild(up); }
    return { max:(d.up?2:1), initial:0, show(k){ hl.classList.toggle('show',k>=1); if(up) up.classList.toggle('show',k>=2); }};
  }
  function bStack(el){
    const s=el.querySelector('.seq'); s.innerHTML='';
    const list=JSON.parse(el.dataset.imgs||'[]');
    const big=Math.max(78,100-(list.length-1)*6);
    const items=list.map((src,i)=>{ const im=document.createElement('img');
      const off=i*(list.length>1?(100-big)/(list.length-1):0), rot=(i-(list.length-1)/2)*1.2;
      im.src=C+src;
      im.style.cssText=`position:absolute;left:${off}%;top:${off}%;width:${big}%;height:${big}%;`+
        `object-fit:contain;background:#fff;border-radius:10px;padding:5px;`+
        `box-shadow:0 16px 42px rgba(5,20,50,.34),0 0 0 1px rgba(20,40,80,.10);`+
        `opacity:0;transform:scale(1.12) rotate(${rot}deg);transition:opacity .5s ease, transform .55s cubic-bezier(.2,.9,.3,1.2);z-index:${i+2};`;
      s.appendChild(im); return {im,rot}; });
    return { max:list.length-1, initial:0, show(k){
      items.forEach((it,i)=>{ if(i<=k){ it.im.style.opacity='1'; it.im.style.transform=`scale(1) rotate(${it.rot}deg)`; } }); }};
  }
  const builders={articles:bArticles, highlightSeq:bHighlight, stack:bStack};
  function runSeq(el, kind, exportStep){
    const s=el.querySelector('.seq'); if(kind!=='articles' && !s) return;
    const c=builders[kind](el);
    if(exportStep!==undefined){ c.show(Math.min(exportStep,c.max)); return; }
    let k=c.initial; c.show(k);
    el._ci=0; el._clickActions=[];
    for(let j=k+1;j<=c.max;j++){ const t=j; el._clickActions.push(()=>c.show(t)); }
  }
  const anims={
    articles:(el,step)=>runSeq(el,'articles',step),
    highlightSeq:(el,step)=>runSeq(el,'highlightSeq',step),
    stack:(el,step)=>runSeq(el,'stack',step)
  };

  // ---------- build ----------
  const stage=document.getElementById('stage'), barfill=document.getElementById('barfill'),
        counter=document.getElementById('counter'), gridEl=document.getElementById('grid'),
        hint=document.getElementById('hint');
  let cur=0, els=[];
  const EXPORT=/[?&]export/.test(location.search); if(EXPORT) document.body.classList.add('export');
  const _sm=/[?&]step=(\d+)/.exec(location.search); const EXPORT_STEP=_sm?+_sm[1]:0;

  S.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slide';
    d.innerHTML=`<div class="box"><img class="base" loading="${i<3?'eager':'lazy'}" src="${s.src}" alt="${s.name}">`+
      (s.ovl?`<div class="ov">${s.ovl}</div>`:'')+`</div>`;
    if(s.imgs) d.dataset.imgs=JSON.stringify(s.imgs);
    if(s.seq)  d.dataset.seq=JSON.stringify(s.seq);
    stage.appendChild(d); els.push(d);
  });

  S.forEach((s,i)=>{
    const t=document.createElement('div'); t.className='thumb';
    t.innerHTML=`<span class="n">${i+1}</span><img loading="lazy" src="${s.src}">`+(s.ovl||s.anim?'<span class="k">EDIT</span>':'');
    t.addEventListener('click',()=>{go(i);toggleGrid(false);});
    gridEl.appendChild(t);
  });
  const thumbs=[...gridEl.children];

  function render(){
    els.forEach((el,i)=>{ el.classList.remove('active','prev','next');
      el.classList.add(i===cur?'active':(i<cur?'prev':'next')); });
    barfill.style.width=((cur+1)/S.length*100)+'%';
    counter.textContent=(cur+1)+' / '+S.length;
    thumbs.forEach((t,i)=>t.classList.toggle('cur',i===cur));
    els.forEach((el,i)=>{const v=el.querySelector('video'); if(v){ i===cur?(v.currentTime=0,v.play().catch(()=>{})):v.pause(); }});
    const a=S[cur].anim; if(a&&anims[a]&&!NOSHOT){ if(EXPORT) anims[a](els[cur],EXPORT_STEP); else setTimeout(()=>anims[a](els[cur]),260); }
    [cur+1,cur+2].forEach(n=>{ if(S[n]){const im=new Image();im.src=S[n].src;} });
    try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
  }
  function go(i){ i=Math.max(0,Math.min(S.length-1,i)); if(i===cur) return; cur=i; render(); }
  function next(){ const el=els[cur]; if(el&&el._clickActions&&el._ci<el._clickActions.length){ el._clickActions[el._ci++](); return; } go(cur+1); }
  function prev(){go(cur-1);}
  function replay(){ const el=els[cur]; el._ci=0; el._clickActions=null; const a=S[cur].anim; if(a&&anims[a]) anims[a](el); }
  function toggleGrid(f){ const sh=f!==undefined?f:!gridEl.classList.contains('show'); gridEl.classList.toggle('show',sh);
    if(sh){const c=thumbs[cur]; if(c)c.scrollIntoView({block:'center'});} }
  function toggleFull(){ document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.(); }

  window.addEventListener('keydown',e=>{
    if(gridEl.classList.contains('show')){ if(e.key==='Escape'||e.key==='o'||e.key==='O'){toggleGrid(false);e.preventDefault();} return; }
    switch(e.key){
      case 'ArrowRight':case 'ArrowDown':case 'PageDown':case ' ':next();e.preventDefault();break;
      case 'ArrowLeft':case 'ArrowUp':case 'PageUp':prev();e.preventDefault();break;
      case 'Home':go(0);e.preventDefault();break; case 'End':go(S.length-1);e.preventDefault();break;
      case 'f':case 'F':toggleFull();break; case 'o':case 'O':toggleGrid();e.preventDefault();break;
      case 'r':case 'R':replay();break;
    }
  });
  stage.addEventListener('click',e=>{ if(e.target.closest('.navbtn')||e.target.closest('video'))return;
    (e.clientX/window.innerWidth<0.22)?prev():next(); });
  document.getElementById('hud').addEventListener('click',e=>{const b=e.target.closest('.navbtn');if(!b)return;
    ({next,prev,grid:toggleGrid,full:toggleFull})[b.dataset.act]?.();e.stopPropagation();});
  let tx=0,ty=0;
  stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev();},{passive:true});
  setTimeout(()=>hint.classList.add('hide'),4600);

  const m=/^#(\d+)$/.exec(location.hash); if(m){const i=+m[1]-1; if(i>=0&&i<S.length)cur=i;}
  window.addEventListener('hashchange',()=>{const m=/^#(\d+)$/.exec(location.hash); if(m){const i=+m[1]-1; if(i>=0&&i<S.length&&i!==cur){cur=i;render();}}});
  render();
})();
</script>
</body>
</html>
